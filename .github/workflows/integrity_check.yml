name: Integrity Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  LLVM_MINGW_VERSION: "20260922"
  # The toolchain file resolves clang from here, never from PATH, so a cache hit can't pick up the
  # runner's own compiler.
  LLVM_MINGW_ROOT: C:\llvm-mingw

jobs:
  integrity-check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - &python-deps
        name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2

      - name: Run validation scripts
        shell: cmd
        run: |
          python scripts\Ghidra\CheckHeaderDuplicates.py
          python scripts\Ghidra\check_data_symbols_dups.py
          python scripts\check_hook_annotations.py

      - &llvm-mingw-cache
        name: Cache llvm-mingw
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: C:\llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ucrt-x86_64

      - &llvm-mingw-download
        name: Download llvm-mingw
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $v = $env:LLVM_MINGW_VERSION
          Invoke-WebRequest `
            -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-x86_64.zip" `
            -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\
          Rename-Item "C:\llvm-mingw-$v-ucrt-x86_64" C:\llvm-mingw

      - &generated-stub
        name: Stub generated hook table
        shell: cmd
        run: |
          if not exist src\generated mkdir src\generated
          type nul > src\generated\hook_generated.c

      - name: Build mod (clang, hardened Release)
        shell: cmd
        run: |
          cmake --preset clang-release
          cmake --build --preset clang-release

  sanitizers:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ clang-asan, clang-ubsan ]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - *python-deps
      - *llvm-mingw-cache
      - *llvm-mingw-download
      - *generated-stub

      - name: Build mod (${{ matrix.preset }})
        shell: cmd
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

  fuzz:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - *python-deps
      - *llvm-mingw-cache
      - *llvm-mingw-download
      - *generated-stub

      - name: Build fuzzers
        shell: cmd
        run: |
          cmake --preset clang-fuzz
          cmake --build --preset clang-fuzz

      - name: Fuzz (60s per harness, committed seeds)
        shell: cmd
        run: python scripts\run_fuzzers.py --build-dir build\clang-fuzz --seconds 60

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: test-results/fuzz

  static-analysis:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - *python-deps
      - *llvm-mingw-cache
      - *llvm-mingw-download
      - *generated-stub

      - name: Configure and generate sources
        shell: cmd
        run: |
          cmake --preset clang-release
          cmake --build --preset clang-release --target generate_global_h generate_hooks generate_embedded_shaders generate_build_id

      - name: Clang static analyzer (scan-build)
        shell: cmd
        run: |
          python scripts\static_analysis.py ^
            --cdb build\clang-release\compile_commands.json ^
            --out static-analysis ^
            --clang %LLVM_MINGW_ROOT%\bin\clang.exe ^
            --summary "%GITHUB_STEP_SUMMARY%"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-report
          path: static-analysis/scan-build-*

      - name: Upload SARIF to code scanning
        # Fork PRs get a read-only token; the gate and step summary above cover them.
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: static-analysis/code-scanning.sarif
          category: clang-static-analyzer
